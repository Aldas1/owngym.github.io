<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121519" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --sunk:#F4F5F7; --ink:#19202A; --muted:#5D6673; --line:#D3D7DC;
  --blue:#1F4FA8; --on-blue:#FFFFFF; --red:#C8102E; --done-bg:#E4EBF7; --short-bg:#F9E5E8;
  --p25:#C8102E; --p20:#1F4FA8; --p15:#E2B10C; --p10:#2E8B3E; --p5:#F7F7F5; --p2:#C8102E; --p1:#A9AFB6;
  --steel:#8D959E; --steel-dark:#6B737C; --plate-edge:rgba(0,0,0,.25);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --surface:#1B2027; --sunk:#151A20; --ink:#E8EBEE; --muted:#9AA3AE; --line:#2E353E;
    --blue:#6E9BFF; --on-blue:#0E1420; --red:#FF6B7F; --done-bg:#1E2B44; --short-bg:#3A1F26;
    --steel:#7C848D; --steel-dark:#5E666F; --plate-edge:rgba(255,255,255,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1B2027; --sunk:#151A20; --ink:#E8EBEE; --muted:#9AA3AE; --line:#2E353E;
  --blue:#6E9BFF; --on-blue:#0E1420; --red:#FF6B7F; --done-bg:#1E2B44; --short-bg:#3A1F26;
  --steel:#7C848D; --steel-dark:#5E666F; --plate-edge:rgba(255,255,255,.18);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cond,.big,h1,h2,h3,.num,.brand{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(140px + env(safe-area-inset-bottom,0px))}
h2,h3{margin:0;font-weight:600;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:28px;line-height:1;letter-spacing:.01em}
.brand svg{flex:none}
.sync{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:36px;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font:500 13px "Barlow",system-ui,sans-serif;color:var(--muted);text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--steel);flex:none}
.sync[data-s="ok"] i{background:var(--p10)}
.sync[data-s="busy"] i{background:var(--p15)}
.sync[data-s="err"] i{background:var(--red)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
.btn{appearance:none;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px/1 "Barlow",system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:0 10px}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--red)}
.btn.wide{width:100%;min-height:52px;font-size:18px}
.icon{appearance:none;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon.armed{width:auto;padding:0 10px;font:600 14px "Barlow",sans-serif;color:var(--red);background:var(--short-bg)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.field input,.field select{color:var(--ink);font-size:16px}
.page-title{font-size:34px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px "Barlow",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* today */
.next{padding:4px 0 8px}
.next .from{color:var(--muted);margin:14px 0 2px}
.big{font-size:52px;font-weight:700;line-height:.95;letter-spacing:-.005em}
.plan{list-style:none;margin:18px 0 18px;padding:0;border-top:1px solid var(--line)}
.plan li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan strong{display:block;font-weight:600;font-size:18px}
.plan .pw{text-align:right}
.plan .pw .num{font-size:30px;font-weight:600;line-height:1}
.plan .pw small{display:block;color:var(--muted);font-size:13px}
.u{color:var(--muted);font-size:15px}
.intro h2{font-size:30px;margin-bottom:6px}
.intro p{color:var(--muted);margin-bottom:14px;max-width:46ch}
.last{margin-top:22px;font-size:14px;color:var(--muted);text-align:center}

/* session */
.sess-head{margin-bottom:16px}
.sess-head .big{font-size:44px}
.ex{margin-bottom:12px;padding:14px 14px 8px}
.ex.complete{border-color:var(--blue)}
.ex.missed{border-color:var(--red)}
.ex-head{display:flex;align-items:baseline;gap:10px}
.ex-head h3{font-size:26px;flex:1 1 auto}
.ex-head .icon{align-self:center}
.why{font-size:13px;color:var(--muted);margin-top:2px}
.plates{display:flex;align-items:center;gap:12px;margin:10px 0 6px;min-height:56px}
.plates svg{flex:none;display:block}
.plates .pl-txt{font-size:14px;color:var(--muted)}
.bar{fill:var(--steel)}
.sleeve{fill:var(--steel-dark)}
.plate{stroke:var(--plate-edge);stroke-width:1}
.sets{margin-top:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center;padding:6px 6px;margin:0 -6px;border-radius:8px}
.set.done{background:var(--done-bg)}
.set.short{background:var(--short-bg)}
.sn{font:600 16px "Barlow Condensed",sans-serif;color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;gap:6px;min-width:0}
.fld input{font:600 22px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;text-align:center;padding:6px 4px;min-width:0;background:var(--surface)}
.fld span{font-size:13px;color:var(--muted);flex:none;min-width:28px}
.tick{appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;cursor:pointer;display:grid;place-items:center;justify-self:end}
.tick svg{width:22px;height:22px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tick:hover{border-color:var(--blue);color:var(--line)}
.tick[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.set.short .tick[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.ex .row.small{margin-top:4px}
.add-ex{margin:16px 0 12px}
.add-ex label{display:block;font-weight:600;margin-bottom:8px}
.add-ex .row input{flex:1 1 180px;width:auto}
.notes{display:block;font-weight:600;margin:12px 0 16px}
.notes textarea{margin-top:6px;font-weight:400}

/* history */
.hist{margin-bottom:12px}
.hist header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hist h3{font-size:26px}
.hist .vol{text-align:right;white-space:nowrap}
.hist .vol .num{font-size:24px;font-weight:600}
.hist-ex{list-style:none;padding:0;margin:12px 0 0}
.hist-ex li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hist-ex li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hist-ex li.miss span:last-child{color:var(--red)}
.note{margin-top:10px;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:15px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:28px;margin-bottom:6px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px}
.stat .num{display:block;font-size:30px;font-weight:600;line-height:1}
.stat small{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--surface);stroke:var(--blue);stroke-width:2}
.ch-dot.pr{fill:var(--blue)}
.ch-txt{fill:var(--muted);font:13px "Barlow",sans-serif}
.recent{list-style:none;padding:0;margin:12px 0 0}
.recent li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.recent li span:last-child{font-variant-numeric:tabular-nums}

/* routines */
.rt{margin-bottom:12px}
.rt header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rt h3{font-size:26px}
.badge{font:600 13px "Barlow",sans-serif;color:var(--blue);background:var(--done-bg);padding:3px 10px;border-radius:999px;white-space:nowrap}
.rt-w{margin-top:10px;font-size:15px}
.rt-w b{font-weight:600}
.rt-w span{color:var(--muted)}
.section-gap{margin-top:28px}
.settings h3{font-size:24px;margin-bottom:12px}
.settings .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wk{margin-bottom:12px;border:1px solid var(--line)}
.wk legend{display:none}
.ed-ex{border-top:1px solid var(--line);padding:12px 0}
.ed-ex .row{flex-wrap:nowrap}
.ed-nums{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;margin-top:8px;align-items:end}
.ed-nums .field input{text-align:center;padding:8px 4px}
.chk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--muted);padding-bottom:10px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--blue)}

/* nav + rest */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{appearance:none;background:none;border:0;color:var(--muted);font:500 12px "Barlow",sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;cursor:pointer}
.nav svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 6px 6px 18px;font-size:15px}
.rest[hidden]{display:none}
.rest .num{font-size:24px;font-weight:600;min-width:3.2ch}
.rest.ready{background:var(--blue);color:var(--on-blue)}
.rest button{appearance:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(127,127,127,.25);color:inherit;font-size:18px;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw}
.banner{margin-bottom:16px;border-color:var(--p15)}
.banner h3{font-size:22px;margin-bottom:4px}
.banner p{color:var(--muted);font-size:15px;margin-bottom:10px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:420px){
  .big{font-size:44px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .set{grid-template-columns:18px 1fr 1fr 44px;gap:6px}
  .fld span{min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><rect x="0" y="12" width="34" height="4" rx="1" style="fill:var(--steel)"/><rect x="6" y="1" width="5" height="26" rx="1.5" style="fill:var(--p25)"/><rect x="12" y="3" width="5" height="22" rx="1.5" style="fill:var(--p20)"/><rect x="18" y="6" width="4" height="16" rx="1.5" style="fill:var(--p15)"/></svg>
      Iron Log
    </div>
    <button class="sync" id="sync" data-act="exportB" data-s="idle"><i></i><span>Back up</span></button>
  </header>
  <main id="view"></main>
</div>
<div class="rest" id="rest" hidden><span id="restL">Rest</span><span class="num" id="restT">0:00</span><button data-act="restOff" aria-label="Hide rest timer">×</button></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="nav" aria-label="Sections"><div class="nav-in">
  <button data-act="nav" data-tab="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Today</button>
  <button data-act="nav" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
  <button data-act="nav" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3.5 18.5l5.5-6.5 4 3.5 7.5-9"/></svg>Progress</button>
  <button data-act="nav" data-tab="routines"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg>Routines</button>
</div></nav>

<script>
(function(){
"use strict";
var LS = "ironlog:v1";
var TABS = ["today","history","progress","routines"];
var DEFAULT_SETTINGS = {unit:"kg", bar:20, activeRoutine:null, rest:90};
var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

var S = {settings:Object.assign({},DEFAULT_SETTINGS), library:{exercises:{}}, routines:{}, sessions:{}};
var ui = {tab:"today", edit:null, arm:null, armT:null, progressEx:null, routinePick:null, workoutPick:null, restStart:null};

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function stable(v){
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ":" + stable(v[k]); }).join(",") + "}";
  return JSON.stringify(v);
}
function num(v){ var x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; }
function int(v){ var x = parseInt(v, 10); return isNaN(x) ? null : x; }
function U(){ return S.settings.unit === "lb" ? "lb" : "kg"; }
function step(){ return U() === "kg" ? 2.5 : 5; }
function roundW(w){ var s = step(); return Math.round(w / s) * s; }
function fmt(w){ if (w == null || w === "") return ""; return String(Math.round(w * 100) / 100); }
function fmtBig(n){ return Math.round(n).toLocaleString(); }
function dateStr(t){
  var d = new Date(t), now = new Date();
  var o = {weekday:"short", day:"numeric", month:"short"};
  if (d.getFullYear() !== now.getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
}
function timeStr(t){ return new Date(t).toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"}); }
function dur(ms){ var m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min"; }
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ---------- local cache ---------- */
function loadLocal(){
  try {
    var raw = localStorage.getItem(LS);
    if (!raw) return;
    var d = JSON.parse(raw);
    S = {
      settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {}),
      library: Object.assign({exercises:{}}, d.library || {}),
      routines: d.routines || {},
      sessions: d.sessions || {}
    };
  } catch (e) {}
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("Couldn’t save: this phone’s storage for the app is full. Export a backup."); } }
function hasData(){ return Object.keys(S.routines).length || Object.keys(S.sessions).length; }

/* ---------- storage on this device ---------- */
var persistAsked = false;
function touch(){
  saveLocal();
  if (!persistAsked) { persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
  updateSyncBadge();
}
function isStandalone(){ return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function daysSince(t){ return t ? Math.floor((Date.now() - t) / 86400000) : null; }
function backupDue(){ var d = daysSince(S.settings.lastBackup); return hasData() && (d == null || d >= 14); }
function updateSyncBadge(){
  var el = $("#sync"); if (!el) return;
  var d = daysSince(S.settings.lastBackup), t, st;
  if (!hasData()) { st = "idle"; t = "Back up"; }
  else if (d == null) { st = "busy"; t = "Not backed up"; }
  else { st = d >= 14 ? "busy" : "ok"; t = d === 0 ? "Backed up today" : "Backed up " + d + (d === 1 ? " day" : " days") + " ago"; }
  el.dataset.s = st;
  el.querySelector("span").textContent = t;
}
function exportBackup(){
  var name = "iron-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  var stamp = Date.now();
  var snapshot = clone(S); snapshot.settings.lastBackup = stamp;
  var json = JSON.stringify({app:"iron-log", version:1, exportedAt:stamp, state:snapshot});
  var file;
  try { file = new File([json], name, {type:"application/json"}); } catch (e) { file = new Blob([json], {type:"application/json"}); }
  function done(){ S.settings.lastBackup = stamp; saveLocal(); render(); toast("Backup saved"); }
  function download(){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    done();
  }
  if (navigator.canShare && file instanceof File && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:"Iron Log backup"}).then(done, function(e){ if (!e || e.name !== "AbortError") download(); });
  } else download();
}
function importBackup(file){
  var r = new FileReader();
  r.onload = function(){
    var b;
    try { b = JSON.parse(r.result); } catch (e) { toast("That file isn’t an Iron Log backup."); return; }
    if (!b || b.app !== "iron-log" || !b.state) { toast("That file isn’t an Iron Log backup."); return; }
    var st = b.state, hadData = hasData();
    var nr = Object.keys(st.routines || {}).length, ns = Object.keys(st.sessions || {}).filter(function(k){ return st.sessions[k].finished; }).length;
    S.routines = Object.assign({}, S.routines, st.routines || {});
    S.sessions = Object.assign({}, S.sessions, st.sessions || {});
    S.library = {exercises:Object.assign({}, (st.library || {}).exercises || {}, S.library.exercises)};
    if (!hadData) S.settings = Object.assign({}, DEFAULT_SETTINGS, st.settings || {});
    else if (!S.routines[S.settings.activeRoutine]) S.settings.activeRoutine = (st.settings || {}).activeRoutine || Object.keys(S.routines)[0] || null;
    if (st.settings && st.settings.lastBackup && !S.settings.lastBackup) S.settings.lastBackup = st.settings.lastBackup;
    touch(); render();
    toast("Imported " + ns + (ns === 1 ? " workout" : " workouts") + " and " + nr + (nr === 1 ? " routine" : " routines"));
  };
  r.readAsText(file);
}

/* ---------- domain ---------- */
function finishedSessions(){
  return Object.keys(S.sessions).map(function(id){ return [id, S.sessions[id]]; })
    .filter(function(p){ return p[1].finished; })
    .sort(function(a,b){ return b[1].startedAt - a[1].startedAt; });
}
function activeSession(){
  var ids = Object.keys(S.sessions).filter(function(id){ return !S.sessions[id].finished; });
  ids.sort(function(a,b){ return S.sessions[b].startedAt - S.sessions[a].startedAt; });
  return ids.length ? [ids[0], S.sessions[ids[0]]] : null;
}
function sameName(a,b){ return String(a).trim().toLowerCase() === String(b).trim().toLowerCase(); }
function exHistory(name){
  var out = [];
  finishedSessions().forEach(function(p){
    var ex = (p[1].exercises || []).find(function(e){ return sameName(e.name, name); });
    if (ex && ex.sets.some(function(s){ return s.done; })) out.push({id:p[0], s:p[1], ex:ex});
  });
  return out;
}
function doneSets(ex){ return ex.sets.filter(function(s){ return s.done; }); }
function topWeight(ex){ var d = doneSets(ex); return d.length ? Math.max.apply(null, d.map(function(s){ return +s.w || 0; })) : 0; }
function exSuccess(ex){
  if (!ex.targetReps) return true;
  var n = ex.targetSets || ex.sets.length;
  return ex.sets.filter(function(s){ return s.done && (+s.r || 0) >= ex.targetReps; }).length >= n;
}
function plan(item){
  var h = exHistory(item.name);
  var inc = +item.inc || 0;
  if (!h.length) return {w:+item.start || 0, why:+item.start ? "Starting weight" : "First time, set your weight"};
  var lw = topWeight(h[0].ex);
  if (exSuccess(h[0].ex)) {
    return inc ? {w:roundW(lw + inc), why:"+" + fmt(inc) + " " + U() + " after hitting every rep"} : {w:lw, why:"Same as last time"};
  }
  var fails = 0;
  for (var i = 0; i < h.length; i++) { if (!exSuccess(h[i].ex) && topWeight(h[i].ex) === lw) fails++; else break; }
  if (fails >= 3) return {w:Math.max(+S.settings.bar || 0, roundW(lw * 0.9)), why:"Deload 10% after 3 misses at " + fmt(lw)};
  return {w:lw, why:"Repeat: missed reps last time (" + fails + " of 3)"};
}
function nextWorkoutIndex(rid){
  var r = S.routines[rid]; if (!r || !r.workouts.length) return 0;
  var last = finishedSessions().find(function(p){ return p[1].routineId === rid; });
  if (!last) return 0;
  var wi = last[1].workoutIndex; if (wi == null) wi = -1;
  return (wi + 1) % r.workouts.length;
}
function isBarbell(name){
  var lib = S.library.exercises[name];
  if (lib && typeof lib.barbell === "boolean") return lib.barbell;
  var found = false;
  Object.keys(S.routines).forEach(function(id){ S.routines[id].workouts.forEach(function(w){ w.exercises.forEach(function(e){ if (sameName(e.name, name) && e.barbell) found = true; }); }); });
  return found;
}
function allExerciseNames(){
  var set = {};
  Object.keys(S.library.exercises).forEach(function(n){ set[n.toLowerCase()] = n; });
  Object.keys(S.routines).forEach(function(id){ S.routines[id].workouts.forEach(function(w){ w.exercises.forEach(function(e){ if (e.name) set[e.name.toLowerCase()] = e.name; }); }); });
  finishedSessions().forEach(function(p){ p[1].exercises.forEach(function(e){ set[e.name.toLowerCase()] = e.name; }); });
  return Object.keys(set).map(function(k){ return set[k]; }).sort(function(a,b){ return a.localeCompare(b); });
}
function volume(s){ var v = 0; s.exercises.forEach(function(ex){ doneSets(ex).forEach(function(st){ v += (+st.w || 0) * (+st.r || 0); }); }); return v; }
function setSummary(ex){
  var d = doneSets(ex);
  if (!d.length) return "Skipped";
  var same = d.every(function(s){ return +s.w === +d[0].w && +s.r === +d[0].r; });
  if (same) return d.length + "×" + (d[0].r || 0) + " at " + fmt(d[0].w || 0) + " " + U();
  return d.map(function(s){ return fmt(s.w || 0) + "×" + (s.r || 0); }).join(", ") + " " + U();
}

function strongLifts(){
  var kg = U() === "kg";
  function ex(name, sets, start, inc){ return {name:name, sets:sets, reps:5, start:start, inc:inc, barbell:true}; }
  return {
    name: "StrongLifts 5×5",
    workouts: [
      {name:"Workout A", exercises:[ex("Squat",5,kg?20:45,kg?2.5:5), ex("Bench Press",5,kg?20:45,kg?2.5:5), ex("Barbell Row",5,kg?30:65,kg?2.5:5)]},
      {name:"Workout B", exercises:[ex("Squat",5,kg?20:45,kg?2.5:5), ex("Overhead Press",5,kg?20:45,kg?2.5:5), ex("Deadlift",1,kg?40:95,kg?5:10)]}
    ]
  };
}
function blankEx(){ return {name:"", sets:3, reps:8, start:"", inc:step(), barbell:false}; }

/* ---------- plates ---------- */
var PLATES = {
  kg: [[25,"--p25",54,10],[20,"--p20",54,9],[15,"--p15",48,8],[10,"--p10",40,7],[5,"--p5",30,6],[2.5,"--p2",24,5],[1.25,"--p1",20,4]],
  lb: [[45,"--p20",54,10],[35,"--p15",50,9],[25,"--p10",44,8],[10,"--p5",32,6],[5,"--p2",26,5],[2.5,"--p1",20,4]]
};
function platesFor(total){
  var side = (total - (+S.settings.bar || 0)) / 2, out = [];
  PLATES[U()].forEach(function(p){ while (side >= p[0] - 1e-9) { out.push(p); side -= p[0]; } });
  return {plates:out, rest:Math.round(side * 2 * 100) / 100};
}
function plateViz(total){
  var bar = +S.settings.bar || 0;
  if (!total) return '<p class="pl-txt">Enter a weight to see the plates.</p>';
  if (total < bar) return '<p class="pl-txt">Lighter than the ' + fmt(bar) + ' ' + U() + ' bar.</p>';
  var r = platesFor(total), x = 44, rects = "";
  r.plates.forEach(function(p){ rects += '<rect x="' + x + '" y="' + (28 - p[2] / 2) + '" width="' + p[3] + '" height="' + p[2] + '" rx="2" class="plate" style="fill:var(' + p[1] + ')"/>'; x += p[3] + 1.5; });
  var sleeveW = Math.max(x - 42, 0) + 24, W = 42 + sleeveW + 2;
  var svg = '<svg width="' + W + '" height="56" viewBox="0 0 ' + W + ' 56" aria-hidden="true">' +
    '<rect x="0" y="25" width="36" height="6" rx="1" class="bar"/>' +
    '<rect x="42" y="23.5" width="' + sleeveW + '" height="9" rx="2" class="sleeve"/>' +
    '<rect x="36" y="17" width="6" height="22" rx="1.5" class="bar"/>' + rects + '</svg>';
  var label = r.plates.length ? "Each side: " + r.plates.map(function(p){ return fmt(p[0]); }).join(" + ") : "Empty bar";
  if (r.rest > 0.001) label += " (" + fmt(r.rest) + " " + U() + " won’t load evenly)";
  return svg + '<p class="pl-txt">' + esc(label) + '</p>';
}

/* ---------- views ---------- */
function viewToday(){

function exCard(sid, ex, i){
  var cur = (ex.sets.find(function(s){ return !s.done; }) || ex.sets[ex.sets.length - 1] || {}).w;
  var allDone = ex.sets.length && ex.sets.every(function(s){ return s.done; });
  var cls = allDone ? (ex.targetReps && !exSuccess(ex) ? "missed" : "complete") : "";

  var h = '<article class="ex card ' + cls + '" data-sid="' + sid + '" data-ei="' + i + '">' +
    '<header class="ex-head"><h3>' + esc(ex.name) + '</h3><span class="muted">' + (ex.targetReps ? ex.targetSets + '×' + ex.targetReps : ex.sets.length + (ex.sets.length === 1 ? ' set' : ' sets')) + '</span>' +
    '<button class="icon' + (ui.arm === armKey ? ' armed' : '') + '" data-act="rmEx" aria-label="Remove ' + esc(ex.name) + '">' + (ui.arm === armKey ? 'Remove?' : '×') + '</button></header>';

      '<label class="fld"><input data-bind="w" data-sj="' + j + '" inputmode="decimal" autocomplete="off" value="' + esc(fmt(st.w)) + '" aria-label="Set ' + (j + 1) + ' weight"><span>' + U() + '</span></label>' +
      '<label class="fld"><input data-bind="r" data-sj="' + j + '" inputmode="numeric" autocomplete="off" value="' + esc(st.r == null ? "" : st.r) + '" aria-label="Set ' + (j + 1) + ' reps"><span>reps</span></label>' +
      '<button class="tick" data-act="tick" data-sj="' + j + '" aria-pressed="' + !!st.done + '" aria-label="Set ' + (j + 1) + ' done">' + CHECK + '</button></div>';
  }).join("") + '</div>';
  h += '<div class="row small"><button class="btn ghost" data-act="addSet">Add set</button>' + (ex.sets.length > 1 ? '<button class="btn ghost" data-act="rmSet">Remove last set</button>' : '') + '</div></article>';

function viewHistory(){

    var id = p[0], s = p[1];
    var meta = [esc(dateStr(s.startedAt))];
    if (s.routineName) meta.push(esc(s.routineName));
    if (s.endedAt && s.endedAt - s.startedAt < 6 * 3600000) meta.push(dur(s.endedAt - s.startedAt));
    return '<article class="card hist"><header><div><h3>' + esc(s.workoutName || "Workout") + '</h3><p class="muted small">' + meta.join(", ") + '</p></div>' +
      '<p class="vol"><span class="num">' + fmtBig(volume(s)) + '</span> <span class="u">' + U() + ' lifted</span></p></header>' +
      '<ul class="hist-ex">' + s.exercises.map(function(ex){ return '<li class="' + (ex.targetReps && doneSets(ex).length && !exSuccess(ex) ? "miss" : "") + '"><span>' + esc(ex.name) + '</span><span>' + esc(setSummary(ex)) + '</span></li>'; }).join("") + '</ul>' +
      (s.notes ? '<p class="note">' + esc(s.notes) + '</p>' : '') +

      '<button class="btn ghost danger" data-act="delSess" data-id="' + id + '">' + (ui.arm === "del" + id ? "Tap again to delete" : "Delete") + '</button></div></article>';

function viewProgress(){
  var names = [];
  finishedSessions().forEach(function(p){ p[1].exercises.forEach(function(e){ if (doneSets(e).length && !names.some(function(n){ return sameName(n, e.name); })) names.push(e.name); }); });
  if (!names.length) return '<div class="empty"><h2>Nothing to chart yet</h2><p>Log a few workouts and your weights will trend here.</p></div>';
  names.sort(function(a,b){ return a.localeCompare(b); });
  var name = ui.progressEx && names.some(function(n){ return n === ui.progressEx; }) ? ui.progressEx : names[0];
  var hist = exHistory(name).slice().reverse();
  var pts = hist.map(function(x){
    var e1 = 0; doneSets(x.ex).forEach(function(s){ var w = +s.w || 0, r = +s.r || 0; if (r > 0) e1 = Math.max(e1, r === 1 ? w : w * (1 + r / 30)); });
    return {t:x.s.startedAt, w:topWeight(x.ex), e1:e1, ex:x.ex};
  });
  var best = Math.max.apply(null, pts.map(function(p){ return p.w; }));
  var e1 = Math.max.apply(null, pts.map(function(p){ return p.e1; }));
  var h = '<h2 class="page-title">Progress</h2><label class="field">Exercise<select data-change="pex">' + names.map(function(n){ return '<option' + (n === name ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join("") + '</select></label>';
  h += '<div class="stats">' +
    '<div class="stat"><span class="num">' + fmt(pts[pts.length - 1].w) + '</span><small>Latest, ' + U() + '</small></div>' +
    '<div class="stat"><span class="num">' + fmt(best) + '</span><small>Heaviest, ' + U() + '</small></div>' +
    '<div class="stat"><span class="num">' + fmt(Math.round(e1)) + '</span><small>Est. 1-rep max</small></div>' +
    '<div class="stat"><span class="num">' + pts.length + '</span><small>Sessions</small></div></div>';
  h += '<div class="card">' + chartSvg(pts.slice(-40), best) + '</div>';
  h += '<ul class="recent">' + pts.slice(-8).reverse().map(function(p){ return '<li><span>' + esc(dateStr(p.t)) + '</span><span>' + esc(setSummary(p.ex)) + '</span></li>'; }).join("") + '</ul>';
  return h;
}

function chartSvg(pts, best){
  if (pts.length < 2) return '<p class="muted">Log this exercise in at least two workouts to see a trend line.</p>';
  var W = 600, H = 230, pl = 46, pr = 16, pt = 16, pb = 32;
  var ws = pts.map(function(p){ return p.w; });
  var lo = Math.min.apply(null, ws), hi = Math.max.apply(null, ws);
  if (hi === lo) { hi += step() * 2; lo = Math.max(0, lo - step() * 2); }
  var pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  function X(i){ return pl + (W - pl - pr) * i / (pts.length - 1); }
  function Y(w){ return pt + (H - pt - pb) * (1 - (w - lo) / (hi - lo)); }
  var g = "";
  [0, 0.5, 1].forEach(function(f){ var v = lo + (hi - lo) * f, y = Y(v); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" class="ch-grid"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="ch-txt">' + fmt(Math.round(v * 10) / 10) + '</text>'; });
  var d = pts.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.w).toFixed(1); }).join(" ");
  var dots = pts.map(function(p, i){ return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="4.5" class="ch-dot' + (p.w === best ? ' pr' : '') + '"><title>' + esc(dateStr(p.t)) + ': ' + fmt(p.w) + ' ' + U() + '</title></circle>'; }).join("");
  var xl = '<text x="' + pl + '" y="' + (H - 8) + '" class="ch-txt">' + esc(dateStr(pts[0].t)) + '</text><text x="' + (W - pr) + '" y="' + (H - 8) + '" text-anchor="end" class="ch-txt">' + esc(dateStr(pts[pts.length - 1].t)) + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Heaviest completed set per session">' + g + '<path d="' + d + '" class="ch-line"/>' + dots + xl + '</svg>' +
    '<p class="muted small" style="margin-top:6px">Heaviest completed set each session. Filled dots are your best.</p>';
}

function viewRoutines(){
  if (ui.edit) return viewEditor();
  var rids = Object.keys(S.routines).sort(function(a,b){ return (S.routines[a].name || "").localeCompare(S.routines[b].name || ""); });

  var st = S.settings;
  h += '<section class="card settings section-gap"><h3>Settings</h3><div class="grid2">' +
    '<label class="field">Weight unit<select data-change="unit"><option value="kg"' + (U() === "kg" ? " selected" : "") + '>Kilograms (kg)</option><option value="lb"' + (U() === "lb" ? " selected" : "") + '>Pounds (lb)</option></select></label>' +
    '<label class="field">Empty bar (' + U() + ')<input data-bind="bar" inputmode="decimal" value="' + esc(fmt(st.bar)) + '"></label>' +
    '<label class="field">Rest timer (seconds)<input data-bind="rest" inputmode="numeric" value="' + esc(st.rest) + '"></label></div>' +
    '<p class="muted small" style="margin-top:12px">Switching units relabels weights; it doesn’t convert them.</p></section>';
  var d = daysSince(st.lastBackup);
  h += '<section class="card settings section-gap"><h3>Backup</h3><p class="muted small" style="margin-bottom:12px">Your log is stored only on this phone, inside the Home Screen app. Deleting the app icon deletes the data, so export a backup now and then and keep it in Files or iCloud Drive. Import adds a backup’s workouts and routines to what’s already here.</p>' +
    '<p style="margin-bottom:12px">' + (d == null ? "No backup yet." : "Last backup: " + esc(dateStr(st.lastBackup)) + ".") + '</p>' +
    '<div class="row"><button class="btn primary" data-act="exportB">Export backup</button><button class="btn" data-act="importB">Import backup</button></div></section>';
  return h;
}

function viewEditor(){
  var d = ui.edit.draft;
  var h = '<h2 class="page-title">' + (ui.edit.isNew ? "New routine" : "Edit routine") + '</h2>' +
    '<label class="field" style="margin-bottom:14px">Routine name<input data-bind="rName" value="' + esc(d.name) + '" placeholder="e.g. Upper / lower split"></label>';
  d.workouts.forEach(function(w, wi){
    h += '<fieldset class="card wk"><legend>' + esc(w.name) + '</legend><div class="row" style="flex-wrap:nowrap;align-items:flex-end"><label class="field grow">Workout name<input data-bind="wName" data-wi="' + wi + '" value="' + esc(w.name) + '"></label>' +
      (d.workouts.length > 1 ? '<button class="icon" data-act="rmWk" data-wi="' + wi + '" aria-label="Remove ' + esc(w.name) + '" style="margin-bottom:4px">×</button>' : '') + '</div>';
    w.exercises.forEach(function(e, ei){
      var a = ' data-wi="' + wi + '" data-ei="' + ei + '"';
      h += '<div class="ed-ex"><div class="row" style="align-items:flex-end"><label class="field grow">Exercise<input data-bind="eF" data-f="name"' + a + ' list="exList2" value="' + esc(e.name) + '" placeholder="e.g. Squat"></label>' +
        '<button class="icon" data-act="rmEdEx"' + a + ' aria-label="Remove exercise" style="margin-bottom:4px">×</button></div>' +
        '<div class="ed-nums"><label class="field">Sets<input data-bind="eF" data-f="sets"' + a + ' inputmode="numeric" value="' + esc(e.sets) + '"></label>' +
        '<label class="field">Reps<input data-bind="eF" data-f="reps"' + a + ' inputmode="numeric" value="' + esc(e.reps) + '"></label>' +
        '<label class="field">Start ' + U() + '<input data-bind="eF" data-f="start"' + a + ' inputmode="decimal" value="' + esc(fmt(e.start)) + '"></label>' +
        '<label class="field">Step up<input data-bind="eF" data-f="inc"' + a + ' inputmode="decimal" value="' + esc(fmt(e.inc)) + '"></label>' +
        '<label class="chk"><input type="checkbox" data-change="eBar"' + a + (e.barbell ? ' checked' : '') + '>Bar</label></div></div>';
    });
    h += '<button class="btn ghost" data-act="addEdEx" data-wi="' + wi + '">Add exercise</button></fieldset>';
  });
  h += '<datalist id="exList2">' + allExerciseNames().map(function(n){ return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>';
  h += '<button class="btn" data-act="addWk" style="margin-bottom:12px">Add workout</button>' +
    '<p class="muted small" style="margin-bottom:14px">Step up is how much to add next time after you hit every set and rep. Miss three times in a row at the same weight and it drops 10%. Workouts rotate in order.</p>' +
    '<div class="row"><button class="btn primary" data-act="saveRoutine">Save routine</button><button class="btn ghost" data-act="cancelEdit">Cancel</button></div>';
  return h;
}

function render(){
  var v = $("#view"), t = ui.tab;
  v.innerHTML = t === "history" ? viewHistory() : t === "progress" ? viewProgress() : t === "routines" ? viewRoutines() : viewToday();
  document.querySelectorAll(".nav button").forEach(function(b){ if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  updateSyncBadge();
  updateRest();
}

/* ---------- rest timer ---------- */
function updateRest(){
  var el = $("#rest");
  if (!ui.restStart || !activeSession()) { el.hidden = true; return; }
  var sec = Math.floor((Date.now() - ui.restStart) / 1000), target = +S.settings.rest || 90;
  el.hidden = false;
  $("#restT").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  var ready = sec >= target;
  el.classList.toggle("ready", ready);
  $("#restL").textContent = ready ? "Ready for the next set" : "Rest";
}

/* ---------- actions ---------- */
function armed(key){
  clearTimeout(ui.armT);
  if (ui.arm === key) { ui.arm = null; return true; }
  ui.arm = key;
  ui.armT = setTimeout(function(){ ui.arm = null; render(); }, 3500);
  render();
  return false;
}
function exCtx(el){
  var card = el.closest("[data-ei]");
  var s = S.sessions[card.dataset.sid];
  return {card:card, sid:card.dataset.sid, s:s, ex:s.exercises[+card.dataset.ei]};
}
function go(tab){ ui.tab = tab; render(); if (location.hash.slice(1) !== tab) location.hash = tab; }

function startSession(rid, wi){
  if (activeSession()) { toast("Finish or discard the current workout first."); return; }
  var id = uid("s_"), s = {startedAt:Date.now(), finished:false, notes:"", exercises:[]};
  if (rid) {
    var r = S.routines[rid], w = r.workouts[wi];
    s.routineId = rid; s.routineName = r.name; s.workoutIndex = wi; s.workoutName = w.name;
    s.exercises = w.exercises.map(function(it){
      var p = plan(it), n = Math.max(1, +it.sets || 1), sets = [];
      for (var k = 0; k < n; k++) sets.push({w:p.w || null, r:+it.reps || null, done:false});
      return {name:it.name, targetSets:n, targetReps:+it.reps || 0, barbell:!!it.barbell, why:p.why, sets:sets};
    });
  } else s.workoutName = "Workout";
  S.sessions[id] = s;
  ui.workoutPick = null; ui.restStart = null;
  touch(id);
  go("today");
  window.scrollTo(0, 0);
}

function addSLRoutine(){
  var id = uid("r_");
  S.routines[id] = strongLifts();
  touch(id);
  if (!S.routines[S.settings.activeRoutine]) { S.settings.activeRoutine = id; touch("settings"); }
  toast("StrongLifts 5×5 added");
  render();
}

var actions = {
  nav: function(b){ ui.arm = null; go(b.dataset.tab); window.scrollTo(0, 0); },
  addSL: addSLRoutine,
  newRoutine: function(){ ui.edit = {id:uid("r_"), isNew:true, draft:{name:"", workouts:[{name:"Workout A", exercises:[blankEx()]}]}}; go("routines"); },
  editRoutine: function(b){ ui.edit = {id:b.dataset.id, isNew:false, draft:clone(S.routines[b.dataset.id])}; go("routines"); },
  pickRoutine: function(b){ ui.routinePick = b.dataset.id; ui.workoutPick = null; render(); },
  pickWorkout: function(b){ ui.workoutPick = +b.dataset.wi; render(); },
  start: function(b){ startSession(b.dataset.id, +b.dataset.wi); },
  startEmpty: function(){ startSession(null); setTimeout(function(){ var i = $("#newEx"); if (i) i.focus(); }, 50); },
  tick: function(b){
    var c = exCtx(b), st = c.ex.sets[+b.dataset.sj];
    st.done = !st.done;
    if (st.done) { if (st.r == null && c.ex.targetReps) st.r = c.ex.targetReps; ui.restStart = Date.now(); }
    touch(c.sid); render();
  },
  addSet: function(b){
    var c = exCtx(b), last = c.ex.sets[c.ex.sets.length - 1] || {w:null, r:null};
    c.ex.sets.push({w:last.w, r:last.r, done:false});
    touch(c.sid); render();
  },
  rmSet: function(b){ var c = exCtx(b); c.ex.sets.pop(); touch(c.sid); render(); },
  rmEx: function(b){
    var c = exCtx(b);
    if (!armed("rmEx" + c.sid + "_" + c.card.dataset.ei)) return;
    c.s.exercises.splice(+c.card.dataset.ei, 1); touch(c.sid); render();
  },
  addEx: function(b){
    var inp = $("#newEx"), name = inp.value.trim(), s = S.sessions[b.dataset.id];
    if (!name) { inp.focus(); return; }
    var canon = allExerciseNames().find(function(n){ return sameName(n, name); }) || name;
    var h = exHistory(canon), sets;
    if (h.length) sets = doneSets(h[0].ex).map(function(x){ return {w:x.w, r:x.r, done:false}; });
    else sets = [0,1,2].map(function(){ return {w:null, r:null, done:false}; });
    s.exercises.push({name:canon, barbell:isBarbell(canon), why:h.length ? "Last time: " + setSummary(h[0].ex) : "", sets:sets});
    touch(b.dataset.id); render();
    setTimeout(function(){ var cards = document.querySelectorAll(".ex"); if (cards.length) cards[cards.length - 1].scrollIntoView({block:"center"}); }, 30);
  },
  finish: function(b){
    var id = b.dataset.id, s = S.sessions[id];
    var wasEditing = s.editing;
    s.finished = true; delete s.editing;
    if (!s.endedAt) s.endedAt = Date.now();
    var libChanged = false;
    s.exercises.forEach(function(ex){ if (!S.library.exercises[ex.name]) { S.library.exercises[ex.name] = {barbell:!!ex.barbell}; libChanged = true; } });
    touch(id); if (libChanged) touch("library");
    ui.restStart = null;
    toast(wasEditing ? "Changes saved" : "Workout saved. Nice work.");
    if (wasEditing) go("history"); else render();
    window.scrollTo(0, 0);
  },
  discard: function(b){
    var id = b.dataset.id;
    if (!armed("discard" + id)) return;
    var wasEditing = S.sessions[id].editing;
    delete S.sessions[id]; touch(id); ui.restStart = null;
    toast(wasEditing ? "Workout deleted" : "Workout discarded");
    render();
  },
  exportB: function(){ exportBackup(); },
  importB: function(){ var i = $("#importFile"); i.value = ""; i.click(); },
  restOff: function(){ ui.restStart = null; updateRest(); },
  editSess: function(b){
    if (activeSession()) { toast("Finish or discard the current workout first."); return; }
    var s = S.sessions[b.dataset.id]; s.finished = false; s.editing = true;
    touch(b.dataset.id); go("today"); window.scrollTo(0, 0);
  },
  delSess: function(b){
    var id = b.dataset.id;
    if (!armed("del" + id)) return;
    delete S.sessions[id]; touch(id); toast("Workout deleted"); render();
  },
  activate: function(b){ S.settings.activeRoutine = b.dataset.id; ui.routinePick = null; ui.workoutPick = null; touch("settings"); render(); },
  delRoutine: function(b){
    var id = b.dataset.id;
    if (!armed("delR" + id)) return;
    delete S.routines[id]; touch(id);
    if (S.settings.activeRoutine === id) { S.settings.activeRoutine = Object.keys(S.routines)[0] || null; touch("settings"); }
    toast("Routine deleted"); render();
  },
  addWk: function(){ var d = ui.edit.draft; d.workouts.push({name:"Workout " + String.fromCharCode(65 + d.workouts.length), exercises:[blankEx()]}); render(); },
  rmWk: function(b){ ui.edit.draft.workouts.splice(+b.dataset.wi, 1); render(); },
  addEdEx: function(b){ ui.edit.draft.workouts[+b.dataset.wi].exercises.push(blankEx()); render(); },
  rmEdEx: function(b){ ui.edit.draft.workouts[+b.dataset.wi].exercises.splice(+b.dataset.ei, 1); render(); },
  cancelEdit: function(){ ui.edit = null; render(); },
  saveRoutine: function(){
    var d = clone(ui.edit.draft);
    d.name = (d.name || "").trim() || "My routine";
    d.workouts = d.workouts.map(function(w, i){
      return {name:(w.name || "").trim() || "Workout " + String.fromCharCode(65 + i), exercises:w.exercises.filter(function(e){ return (e.name || "").trim(); }).map(function(e){
        return {name:e.name.trim(), sets:Math.max(1, int(e.sets) || 1), reps:Math.max(1, int(e.reps) || 1), start:num(e.start) || 0, inc:num(e.inc) || 0, barbell:!!e.barbell};
      })};
    }).filter(function(w){ return w.exercises.length; });
    if (!d.workouts.length) { toast("Add at least one exercise with a name."); return; }
    var id = ui.edit.id;
    S.routines[id] = d; touch(id);
    if (!S.routines[S.settings.activeRoutine]) { S.settings.activeRoutine = id; touch("settings"); }
    ui.edit = null; ui.workoutPick = null;
    toast("Routine saved"); render();
  }
};

var binders = {
  w: function(t){
    var c = exCtx(t), j = +t.dataset.sj, old = c.ex.sets[j].w, nv = num(t.value);
    c.ex.sets[j].w = nv;
    for (var k = j + 1; k < c.ex.sets.length; k++) {
      var st = c.ex.sets[k];
      if (!st.done && st.w === old) { st.w = nv; var inp = c.card.querySelector('input[data-bind="w"][data-sj="' + k + '"]'); if (inp) inp.value = fmt(nv); }
    }
    var pl = c.card.querySelector(".plates");
    if (pl) { var cur = (c.ex.sets.find(function(s){ return !s.done; }) || c.ex.sets[c.ex.sets.length - 1]).w; pl.innerHTML = plateViz(+cur || 0); }
    touch(c.sid);
  },
  r: function(t){ var c = exCtx(t); c.ex.sets[+t.dataset.sj].r = int(t.value); touch(c.sid); },
  notes: function(t){ S.sessions[t.dataset.id].notes = t.value; touch(t.dataset.id); },
  bar: function(t){ S.settings.bar = num(t.value) || 0; touch("settings"); },
  rest: function(t){ S.settings.rest = int(t.value) || 90; touch("settings"); },
  rName: function(t){ ui.edit.draft.name = t.value; },
  wName: function(t){ ui.edit.draft.workouts[+t.dataset.wi].name = t.value; },
  eF: function(t){ ui.edit.draft.workouts[+t.dataset.wi].exercises[+t.dataset.ei][t.dataset.f] = t.value; }
};
var changers = {
  pex: function(t){ ui.progressEx = t.value; render(); },
  unit: function(t){
    var st = S.settings;
    if (t.value === "lb" && +st.bar === 20) st.bar = 45;
    if (t.value === "kg" && +st.bar === 45) st.bar = 20;
    st.unit = t.value; touch("settings"); render();
  },
  eBar: function(t){ ui.edit.draft.workouts[+t.dataset.wi].exercises[+t.dataset.ei].barbell = t.checked; }
};

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b, e);
});
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.dataset && t.dataset.bind && binders[t.dataset.bind]) binders[t.dataset.bind](t);
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "importFile") { if (t.files && t.files[0]) importBackup(t.files[0]); return; }
  if (t.dataset && t.dataset.change && changers[t.dataset.change]) changers[t.dataset.change](t);
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.id === "newEx") { e.preventDefault(); var b = document.querySelector('[data-act="addEx"]'); if (b) b.click(); }
});
document.addEventListener("focusin", function(e){
  if (e.target.matches && e.target.matches(".fld input")) setTimeout(function(){ try { e.target.select(); } catch (x) {} }, 0);
});

function tabFromHash(){ var h = location.hash.slice(1); return TABS.indexOf(h) >= 0 ? h : "today"; }
window.addEventListener("hashchange", function(){ var t = tabFromHash(); if (t === ui.tab) return; ui.tab = t; ui.arm = null; render(); });

loadLocal();
ui.tab = tabFromHash();
render();
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
setInterval(updateRest, 1000);
})();
</script>
</body>
</html>
